    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Generador QR - BAMX</title>
        <link rel="stylesheet" href="assets/css/main.css" />
        <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
        <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
        <style>
            body {
                font-family: "Source Sans Pro", sans-serif;
                background-color: #1b1f22; 
                color: #ffffff;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                padding: 20px;
            }

            /* Logos superiores */
            .header-logos {
                position: fixed;
                top: 2rem;
                width: 100%;
                display: flex;
                justify-content: space-between;
                padding: 0 3rem;
                pointer-events: none;
                z-index: 10;
            }
            .header-logos img { height: 3.5rem; }

            .container {
                background-color: rgba(255, 255, 255, 0.05);
                padding: 30px;
                border-radius: 20px; 
                border: 1px solid rgba(255, 255, 255, 0.1);
                width: 100%;
                max-width: 400px;
                text-align: center;
                z-index: 5;
            }

            h1 {
                font-size: 1.5rem;
                letter-spacing: 0.2rem;
                text-transform: uppercase;
                border-bottom: 1px solid #ffffff;
                padding-bottom: 0.5rem;
                margin-bottom: 2rem;
            }

            input[type="text"], input[type="file"] {
                width: 100%;
                padding: 0.75rem;
                margin-bottom: 1.5rem;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.2);
                color: #ffffff;
                border-radius: 10px; 
            }

            button {
                width: 100%;
                background-color: transparent;
                color: #ffffff;
                border: 1px solid #ffffff;
                padding: 0.75rem;
                margin-bottom: 1rem;
                border-radius: 10px; 
                text-transform: uppercase;
                cursor: pointer;
            }

            /* --- BLOQUE PARA EVITAR DESBORDAMIENTO --- */
            #qr-wrapper {
                position: relative; 
                margin: 20px auto;
                background: #ffffff;
                padding: 15px;
                border-radius: 20px; /* Orillas curvas solicitadas */
                box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                width: 100%;
                max-width: 250px; /* Tamaño máximo visual en pantalla */
                box-sizing: border-box;
                overflow: hidden;
            }

            /* Forzamos al canvas a no salirse del contenedor */
            #qrcode canvas, #qrcode img {
                width: 100% !important; 
                height: auto !important;
                display: block;
                border-radius: 10px;
            }

            #qr-logo {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%); 
                width: 50px; 
                height: 50px;
                border-radius: 10px; 
                border: 4px solid white; 
                background-color: white; 
                display: none; 
            }
            #logo-image { width: 100%; height: 100%; object-fit: contain; }
        </style>
    </head>
    <body>

        <div class="header-logos">
            
           
        </div>

        <div class="container">
            <h1>Generador QR</h1>
            
            <input type="text" id="qr-text" placeholder="URL o Texto aquí..." required>
            <input type="file" id="logo-upload" accept="image/png, image/jpeg">
            
            <button onclick="generarQR()">Generar QR</button>
            <button onclick="descargarQR()" id="btn-descargar" style="display:none;">Descargar PNG</button>

            <div id="qr-wrapper">
                <div id="qrcode"></div>
                <div id="qr-logo">
                    <img id="logo-image" src="" alt="Logo">
                </div>
            </div>
        </div>

        <script>
            const contenedorQR = document.getElementById('qrcode');
            const logoWrapper = document.getElementById('qr-logo');
            const logoImage = document.getElementById('logo-image');
            const btnDescargar = document.getElementById('btn-descargar');

            function generarQR() {
                const texto = document.getElementById('qr-text').value;
                const archivoLogo = document.getElementById('logo-upload').files[0];
                contenedorQR.innerHTML = '';
                logoWrapper.style.display = 'none'; 

                if (!texto) return;

                // Generamos a 1000px para evitar pixeleo en la descarga
                new QRCode(contenedorQR, {
                    text: texto,
                    width: 1000, 
                    height: 1000,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H 
                });

                setTimeout(() => {
                    if (archivoLogo) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            logoImage.src = e.target.result;
                            logoWrapper.style.display = 'block';
                            btnDescargar.style.display = 'block';
                        };
                        reader.readAsDataURL(archivoLogo);
                    } else {
                        btnDescargar.style.display = 'block';
                    }
                }, 200);
            }

            function descargarQR() {
    const canvas = contenedorQR.querySelector('canvas');
    const textoInput = document.getElementById('qr-text').value;
    if (!canvas) return;

    const tempCanvas = document.createElement('canvas');
    const context = tempCanvas.getContext('2d');

    // Definimos un margen para que se vea el borde blanco (padding)
    const padding = 60; 
    tempCanvas.width = canvas.width + (padding * 2);
    tempCanvas.height = canvas.height + (padding * 2);

    // 1. Dibujar el fondo blanco con bordes redondeados
    const borderRadius = 80; // Ajusta qué tan redondo quieres el borde blanco
    context.fillStyle = '#ffffff';
    context.beginPath();
    context.roundRect(0, 0, tempCanvas.width, tempCanvas.height, borderRadius);
    context.fill();

    // 2. Dibujar el QR encima del fondo blanco
    context.drawImage(canvas, padding, padding);

    // 3. Lógica del logo (si existe)
    if (logoWrapper.style.display === 'block') {
        const size = canvas.width * 0.22; 
        const x = (tempCanvas.width - size) / 2;
        const y = (tempCanvas.height - size) / 2;
        
        context.fillStyle = 'white';
        context.beginPath();
        context.roundRect(x, y, size, size, size * 0.2);
        context.fill();
        context.drawImage(logoImage, x + (size * 0.1), y + (size * 0.1), size * 0.8, size * 0.8);
    }
    
    // 4. Descarga con nombre dinámico
    const nombreArchivo = textoInput.replace(/[^a-z0-9]/gi, '_').substring(0, 15) || 'QR_BAMX';
    const link = document.createElement('a');
    link.download = `QR_${nombreArchivo}.png`;
    link.href = tempCanvas.toDataURL("image/png");
    link.click();
}
        </script>

<footer id="footer">      
		<p class="copyright">&copy; GENERADOR QR.  <a href="https://www.bapuebla.org.mx/" target="_blank">BAMX PUEBLA</a>.</p>
</footer>
        
    </body>
    </html>
