<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador QR - BAMX</title>
        <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="icon" type="image/png" href="logoico.png">
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <style>
        body {
            background-color: #1b1f22 !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        #fixed-menu {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 1rem 3rem;
            z-index: 10;
        }
        .menu-logo img { height: 3.5rem; }

        /* CONTENEDOR AMPLIADO */
        .container {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 95%;
            max-width: 550px; 
            text-align: center;
            z-index: 5;
            margin-top: 4rem; /* Espacio para compensar la falta del icono */
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            border-bottom: 1px solid #ffffff;
            padding-bottom: 0.5rem;
            margin-bottom: 2rem;
            color: #ffffff;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.85rem;
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 10px; 
        }

        .custom-file-upload {
            display: block;
            width: 100%;
            padding: 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: #bbb;
            cursor: pointer;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }
        .custom-file-upload:hover { border-color: #ffffff; background: rgba(255, 255, 255, 0.1); color: #fff; }
        #logo-upload { display: none; }

        .btn-generate {
            width: 100%;
            background-color: #28a745 !important;
            color: #ffffff !important;
            border: none;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 10px; 
            text-transform: uppercase;
            cursor: pointer;
            font-weight: 800;
            letter-spacing: 0.1rem;
            transition: transform 0.2s;
        }
        .btn-generate:hover { transform: scale(1.02); background-color: #218838 !important; }

        .btn-download {
            width: 100%;
            background-color: transparent;
            color: #ffffff !important;
            border: 1px solid #ffffff;
            padding: 0.85rem;
            border-radius: 10px;
            text-transform: uppercase;
            cursor: pointer;
        }

        #qr-wrapper {
            position: relative; 
            margin: 20px auto;
            background: #ffffff;
            padding: 15px;
            border-radius: 20px;
            width: 250px;
        }
        #qrcode canvas, #qrcode img { width: 100% !important; height: auto !important; }

        #qr-logo {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%); 
            width: 50px; height: 50px;
            background-color: white; border: 4px solid white; border-radius: 10px;
            display: none; 
        }
        #logo-image { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body class="is-preload">

    <nav id="fixed-menu">
        <div class="menu-logo"><img src="LOGOS/3.png" alt="Puebla"></div>
        <div class="menu-logo"><img src="LOGOS/5.png" alt="Tlaxcala"></div>
    </nav>

    <div class="container">
        <h1>Generador QR</h1>
        
        <input type="text" id="qr-text" placeholder="URL o Texto aquí..." required>
        
        <label for="logo-upload" class="custom-file-upload" id="file-label">
            <i class="fa fa-cloud-upload"></i> Seleccionar logo (Opcional)
        </label>
        <input type="file" id="logo-upload" accept="image/png, image/jpeg" onchange="updateFileName()">
        
        <button class="btn-generate" onclick="generarQR()">Generar QR</button>
        <button class="btn-download" onclick="descargarQR()" id="btn-descargar" style="display:none;">Descargar PNG</button>

        <div id="qr-wrapper">
            <div id="qrcode"></div>
            <div id="qr-logo"><img id="logo-image" src="" alt="Logo"></div>
        </div>
    </div>

    <footer id="footer" style="margin-top: 2rem; padding-bottom: 2rem;">
        <p class="copyright">&copy; GENERADOR QR. <a href="https://www.bapuebla.org.mx/" target="_blank">BAMX PUEBLA</a>.</p>
    </footer>

    <script>
        function updateFileName() {
            const input = document.getElementById('logo-upload');
            const label = document.getElementById('file-label');
            if (input.files.length > 0) {
                label.innerHTML = '<i class="fa fa-check"></i> ' + input.files[0].name;
            }
        }

        const contenedorQR = document.getElementById('qrcode');
        const logoWrapper = document.getElementById('qr-logo');
        const logoImage = document.getElementById('logo-image');
        const btnDescargar = document.getElementById('btn-descargar');

        function generarQR() {
            const texto = document.getElementById('qr-text').value;
            const archivoLogo = document.getElementById('logo-upload').files[0];
            contenedorQR.innerHTML = '';
            logoWrapper.style.display = 'none'; 
            if (!texto) return;

            new QRCode(contenedorQR, {
                text: texto, width: 1000, height: 1000,
                colorDark : "#000000", colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H 
            });

            setTimeout(() => {
                if (archivoLogo) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        logoImage.src = e.target.result;
                        logoWrapper.style.display = 'block';
                        btnDescargar.style.display = 'block';
                    };
                    reader.readAsDataURL(archivoLogo);
                } else { btnDescargar.style.display = 'block'; }
            }, 200);
        }

        function descargarQR() {
            const canvas = contenedorQR.querySelector('canvas');
            if (!canvas) return;
            const tempCanvas = document.createElement('canvas');
            const context = tempCanvas.getContext('2d');
            const padding = 60; 
            tempCanvas.width = canvas.width + (padding * 2);
            tempCanvas.height = canvas.height + (padding * 2);

            context.fillStyle = '#ffffff';
            context.beginPath();
            context.roundRect(0, 0, tempCanvas.width, tempCanvas.height, 80);
            context.fill();
            context.drawImage(canvas, padding, padding);

            if (logoWrapper.style.display === 'block') {
                const size = canvas.width * 0.22; 
                const x = (tempCanvas.width - size) / 2;
                const y = (tempCanvas.height - size) / 2;
                context.fillStyle = 'white';
                context.beginPath();
                context.roundRect(x, y, size, size, size * 0.2);
                context.fill();
                context.drawImage(logoImage, x + (size * 0.1), y + (size * 0.1), size * 0.8, size * 0.8);
            }
            
            const link = document.createElement('a');
            link.download = `QR_BAMX.png`;
            link.href = tempCanvas.toDataURL("image/png");
            link.click();
        }
    </script>
</body>
</html>
